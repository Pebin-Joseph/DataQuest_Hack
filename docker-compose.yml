services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-rag-backend
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_EMBED_TIMEOUT=120
      - OLLAMA_GEN_MODEL=llama3.2
      - OLLAMA_GEN_TIMEOUT=45
      - OLLAMA_GEN_MAX_PREDICT=256
      - OLLAMA_GEN_NUM_CTX=2048
      - OLLAMA_GEN_TEMPERATURE=0.2
      - OLLAMA_GEN_CONCURRENCY=1
      - CHROMA_PATH=vector_db
      - CHROMA_COLLECTION=live_docs
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - vector_db_data:/app/vector_db
    restart: unless-stopped

  simulator:
    image: python:3.11-slim
    container_name: live-rag-simulator
    working_dir: /app
    command: ["python", "-u", "live_simulator.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - SIM_DATA_DIR=/app/data
      - SIM_MODE=scripted
      - SIM_INTERVAL_S=15
      - SIM_DELETE_PROB=0.15
    volumes:
      - ./live_simulator.py:/app/live_simulator.py:ro
      - ./data:/app/data
    restart: unless-stopped

volumes:
  vector_db_data:
